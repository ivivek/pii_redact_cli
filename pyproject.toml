[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-redact"
version = "0.1.0"
description = "CLI tool for redacting personally identifiable information from files"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Vivek K", email = "vivek.oss@linetra.com"},
]
keywords = [
    "pii",
    "redaction",
    "redact",
    "anonymization",
    "privacy",
    "gdpr",
    "logs",
    "sanitize",
    "llm",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Text Processing :: Filters",
    "Topic :: Utilities",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/ivivek/pii_redact_cli"
Repository = "https://github.com/ivivek/pii_redact_cli"
Issues = "https://github.com/ivivek/pii_redact_cli/issues"

[project.scripts]
pii-redact = "pii_redact.cli:main"

[tool.setuptools]
packages = ["pii_redact", "pii_redact.file_handlers"]

[tool.setuptools.package-data]
pii_redact = ["sample_config.yaml"]
